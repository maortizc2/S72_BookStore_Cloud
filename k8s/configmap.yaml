apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-config
  labels:
    app: bookstore
data:
  # ============================================================
  # API Gateway (Enrutamiento por rutas hacia los 3 microservicios)
  # ============================================================
  GATEWAY_PORT: "8080"
  AUTH_SERVICE_URL: "http://auth-service:5001"
  BOOKS_SERVICE_URL: "http://books-service:5002"
  ORDERS_SERVICE_URL: "http://orders-service:5003"

  # ============================================================
  # Microservicios Backend (Node.js)
  # ============================================================
  NODE_ENV: "production"
  API_BASE_PATH: "/api"
  # Permite tráfico explícitamente desde el dominio de Cloudflare y el LoadBalancer de AWS
  CORS_ORIGINS: "https://tudominio.com,https://bookstore.pages.dev,http://localhost:3000,http://localhost:8080"

  BOOKS_DEFAULT_LIMIT: "24"
  BOOKS_MAX_LIMIT: "100"
  ORDERS_MAX_DISTINCT_ITEMS: "100"
  ORDERS_MAX_QUANTITY_PER_ITEM: "1000"

  # ============================================================
  # Proxy (3 saltos: Cloudflare -> AWS ELB -> nginx gateway) & Clickstream Logging
  # ============================================================
  HTTP_TRUST_PROXY_HOPS: "3"
  HTTP_JSON_BODY_LIMIT: "32kb"
  ACCESS_LOG_ENABLED: "true"
  ACCESS_LOG_EXCLUDE_PATHS: "/health"
  ACCESS_LOG_MAX_FIELD_LENGTH: "2048"
  ACCESS_LOG_REQUEST_ID_HEADER: "X-Request-Id"
  CLICKSTREAM_FILE_ENABLED: "true"
  CLICKSTREAM_FILE_PATH: "/usr/src/app/logs/clickstream.log"

  # ============================================================
  # Autenticación / Sesión
  # ============================================================
  AUTH_JWT_ALGORITHM: "HS256"
  AUTH_JWT_ISSUER: "bookstore-api"
  AUTH_JWT_AUDIENCE: "bookstore-web"
  AUTH_TOKEN_TTL_SECONDS: "28800"
  AUTH_COOKIE_NAME: "bookstore_session"
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: "lax"
  AUTH_COOKIE_PATH: "/api"

  # ============================================================
  # Amazon RDS PostgreSQL (3 Bases de Datos Independientes en Subred Privada de Datos)
  # ============================================================
  AUTH_DB_HOST: "bookstore-db-auth.cj662yecy80j.us-east-1.rds.amazonaws.com"
  AUTH_DB_PORT: "5432"
  AUTH_DB_NAME: "bookstore_auth"

  BOOKS_DB_HOST: "bookstore-db-books.cj662yecy80j.us-east-1.rds.amazonaws.com"
  BOOKS_DB_PORT: "5432"
  BOOKS_DB_NAME: "bookstore_books"

  ORDERS_DB_HOST: "bookstore-db-orders.cj662yecy80j.us-east-1.rds.amazonaws.com"
  ORDERS_DB_PORT: "5432"
  ORDERS_DB_NAME: "bookstore_orders"

  DB_USER: "bookstore_app"
  DB_SSL: "true"
  DB_SSL_REJECT_UNAUTHORIZED: "false"
  DB_POOL_MAX: "10"
  DB_IDLE_TIMEOUT_MS: "30000"
  DB_CONNECTION_TIMEOUT_MS: "5000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-sidecar-config
  labels:
    app: bookstore
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info

    [INPUT]
        Name              tail
        Tag               clickstream
        Path              /usr/src/app/logs/clickstream.log
        Read_from_Head    True
        Refresh_Interval  5
        Skip_Long_Lines   On

    [OUTPUT]
        Name              cloudwatch_logs
        Match             clickstream
        region            us-east-1
        log_group_name    /bookstore/clickstream
        log_stream_prefix sidecar-
        auto_create_group true

    [OUTPUT]
        Name              stdout
        Match             clickstream
