apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    tier: web
  annotations:
    # En AWS Academy aprovisiona automáticamente un balanceador de carga público en las subredes públicas
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

